<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Valley</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="game-container">
        <!-- Cabeçalho / Status do Jogador -->
        <header class="panel status-bar">
            <div class="player-info">
                <h2>Lvl. <span id="level-display">1</span></h2>
                <div class="xp-bar-container">
                    <div id="xp-bar" class="xp-bar-fill"></div>
                </div>
                <p>XP: <span id="xp-display">0</span> / <span id="xp-needed">100</span></p>
            </div>
            <div class="wallet">
                <p>🪙 <span id="coins-display">0</span></p>
            </div>
        </header>

        <!-- Área de Configuração e Timer -->
        <main class="panel timer-section">
            <h1 id="session-status">Pronto para a jornada?</h1>
            
            <div class="time-display" id="time-display">25:00</div>
            
            <div class="controls" id="controls">
                <div class="input-group">
                    <label for="study-time">Estudo (min):</label>
                    <input type="number" id="study-time" value="25" min="1" max="120">
                </div>
                <div class="input-group">
                    <label for="break-time">Pausa (min):</label>
                    <input type="number" id="break-time" value="5" min="1" max="30">
                </div>
            </div>

            <div class="actions">
                <button id="btn-start" class="btn primary">Iniciar Missão</button>
                <button id="btn-stop" class="btn danger" style="display: none;">Abortar</button>
            </div>
        </main>
    </div>

    <!-- Telas de Alerta / Modais do Jogo -->
    <div id="game-modal" class="modal-overlay" style="display: none;">
        <div class="panel modal-box">
            <h2 id="modal-title">Título</h2>
            <p id="modal-message">Mensagem do modal</p>
            <div id="modal-buttons" class="modal-actions"></div>
        </div>
    </div>

    <!-- Scripts carregados em ordem de dependência -->
    <script src="js/storage.js"></script>
    <script src="js/game.js"></script>
    <script src="js/timer.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
