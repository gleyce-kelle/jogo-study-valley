<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Valley</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="game-container" role="main">
        
        <header class="panel top-bar" aria-label="Status do jogador">
            <div class="stats-group">
                <div class="stat" aria-label="Nível">❤️ Lvl. <span id="level-display">1</span></div>
                <div class="stat" aria-label="Experiência">⭐ <span id="xp-display">0</span> XP</div>
                <div class="stat" aria-label="Moedas">💰 <span id="coins-display">0</span></div>
            </div>
            <div class="menu-group">
                <button id="btn-stats" class="icon-btn" aria-label="Abrir estatísticas">📊</button>
                <button id="btn-settings" class="icon-btn" aria-label="Abrir configurações">⚙️</button>
            </div>
        </header>

        <section class="panel scenario" aria-hidden="true">
            <div id="feedback-layer"></div>
            <div id="character" class="sprite idle"></div>
        </section>

        <main class="panel timer-section" aria-live="polite">
            <h2 id="session-status">Pronto para a jornada?</h2>
            <div class="time-display" id="time-display" aria-label="Tempo restante">25:00</div>
            
            <div class="actions">
                <button id="btn-start" class="btn primary" aria-label="Iniciar sessão de estudo">Iniciar Missão</button>
                <div id="active-actions" style="display: none; gap: 10px; width: 100%;">
                    <button id="btn-pause-resume" class="btn warning" aria-label="Pausar ou continuar">Pausar</button>
                    <button id="btn-stop" class="btn danger" aria-label="Abortar sessão">Abortar</button>
                </div>
            </div>
        </main>

        <footer class="panel xp-section" aria-label="Progresso de nível">
            <div class="xp-bar-container">
                <div id="xp-bar" class="xp-bar-fill"></div>
            </div>
            <div class="xp-text">XP: <span id="xp-current-level">0</span> / <span id="xp-needed">100</span></div>
        </footer>
    </div>

    <!-- Modais do Jogo -->
    <div id="game-modal" class="modal-overlay" style="display: none;">
        <div class="panel modal-box">
            <h2 id="modal-title">Título</h2>
            <p id="modal-message">Mensagem</p>
            <div id="modal-buttons" class="modal-actions"></div>
        </div>
    </div>

    <div id="settings-modal" class="modal-overlay" style="display: none;">
        <div class="panel modal-box">
            <h2>⚙️ Configurações</h2>
            <div class="settings-content">
                <div class="setting-row">
                    <label>Estudo (min):</label>
                    <input type="number" id="cfg-study-time" min="1" max="120">
                </div>
                <div class="setting-row">
                    <label>Pausa (min):</label>
                    <input type="number" id="cfg-break-time" min="1" max="30">
                </div>
                <div class="setting-row">
                    <label>Sons Especiais:</label>
                    <input type="checkbox" id="cfg-sound">
                </div>
                <div class="setting-row">
                    <label>Volume:</label>
                    <input type="range" id="cfg-volume" min="0.1" max="1" step="0.1">
                </div>
                <div class="setting-row">
                    <label>Pausa Automática:</label>
                    <input type="checkbox" id="cfg-auto-break">
                </div>
                <div class="setting-row">
                    <label>Sessão Automática:</label>
                    <input type="checkbox" id="cfg-auto-session">
                </div>
            </div>
            <div class="modal-actions">
                <button id="btn-close-settings" class="btn primary" aria-label="Salvar configurações">Salvar</button>
            </div>
        </div>
    </div>

    <div id="stats-modal" class="modal-overlay" style="display: none;">
        <div class="panel modal-box">
            <h2>📊 Estatísticas</h2>
            <div class="stats-content">
                <p>Nível Atual: <strong id="stat-level">0</strong></p>
                <p>XP Acumulado: <strong id="stat-xp">0</strong></p>
                <p>Moedas: <strong id="stat-coins">0</strong></p>
                <p>Minutos Estudados: <strong id="stat-minutes">0</strong></p>
                <p>Sessões Concluídas: <strong id="stat-sessions">0</strong></p>
                <p>Maior Sessão: <strong id="stat-highest">0</strong> min</p>
            </div>
            <div class="modal-actions">
                <button id="btn-close-stats" class="btn primary" aria-label="Fechar estatísticas">Fechar</button>
            </div>
        </div>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/game.js"></script>
    <script src="js/timer.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
